<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complexity Classes & NP-Completeness — Visual Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Chapter 11: Complexity Classes — P/NP/NP-Hard Venn Diagram Spheres

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.004);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.6);
dl.position.set(20, 60, 30);
scene.add(dl);
const pl = new THREE.PointLight(0x4488ff, 1, 200);
pl.position.set(0, 30, 20);
scene.add(pl);

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(2000*3);
for(let i=0;i<6000;i++) pp[i]=(Math.random()-0.5)*300;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// ===== Complexity Class Spheres =====
const classGroup = new THREE.Group();
scene.add(classGroup);

// P sphere (innermost, green)
const pGeo = new THREE.SphereGeometry(8, 32, 32);
const pMat = new THREE.MeshPhongMaterial({
  color: 0x44ff88, emissive: 0x44ff88, emissiveIntensity: 0.1,
  transparent: true, opacity: 0, wireframe: false
});
const pSphere = new THREE.Mesh(pGeo, pMat);
pSphere.position.set(-3, 0, 0);
classGroup.add(pSphere);

// P wireframe
const pWire = new THREE.Mesh(
  new THREE.SphereGeometry(8.1, 16, 16),
  new THREE.MeshBasicMaterial({color:0x44ff88, wireframe:true, transparent:true, opacity:0})
);
pWire.position.copy(pSphere.position);
classGroup.add(pWire);

// NP sphere (medium, blue)
const npGeo = new THREE.SphereGeometry(15, 32, 32);
const npMat = new THREE.MeshPhongMaterial({
  color: 0x44aaff, emissive: 0x44aaff, emissiveIntensity: 0.08,
  transparent: true, opacity: 0
});
const npSphere = new THREE.Mesh(npGeo, npMat);
npSphere.position.set(-2, 0, 0);
classGroup.add(npSphere);

const npWire = new THREE.Mesh(
  new THREE.SphereGeometry(15.1, 20, 20),
  new THREE.MeshBasicMaterial({color:0x44aaff, wireframe:true, transparent:true, opacity:0})
);
npWire.position.copy(npSphere.position);
classGroup.add(npWire);

// NP-Hard sphere (overlapping, red)
const npHardGeo = new THREE.SphereGeometry(18, 32, 32);
const npHardMat = new THREE.MeshPhongMaterial({
  color: 0xff4466, emissive: 0xff4466, emissiveIntensity: 0.08,
  transparent: true, opacity: 0
});
const npHardSphere = new THREE.Mesh(npHardGeo, npHardMat);
npHardSphere.position.set(8, 0, 0);
classGroup.add(npHardSphere);

const npHardWire = new THREE.Mesh(
  new THREE.SphereGeometry(18.1, 20, 20),
  new THREE.MeshBasicMaterial({color:0xff4466, wireframe:true, transparent:true, opacity:0})
);
npHardWire.position.copy(npHardSphere.position);
classGroup.add(npHardWire);

// NP-Complete region (intersection indicator - glowing ring)
const npcGeo = new THREE.TorusGeometry(10, 1.5, 16, 48);
const npcMat = new THREE.MeshPhongMaterial({
  color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.3,
  transparent: true, opacity: 0
});
const npcTorus = new THREE.Mesh(npcGeo, npcMat);
npcTorus.position.set(5, 0, 0);
npcTorus.rotation.y = Math.PI / 4;
classGroup.add(npcTorus);

// Problem nodes floating inside regions
const problemNodes = [];
function addProblemNode(x, y, z, color, region) {
  const geo = new THREE.OctahedronGeometry(1.2, 0);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.3,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  classGroup.add(mesh);
  problemNodes.push({mesh, region, revealTime: 0});
  return mesh;
}

// P problems
addProblemNode(-8, 3, 2, 0x44ff88, 'P');     // Sorting
addProblemNode(-5, -2, 3, 0x44ff88, 'P');     // MST
addProblemNode(-3, 1, -2, 0x44ff88, 'P');     // Shortest Path
addProblemNode(-6, -1, -1, 0x44ff88, 'P');    // 2-SAT

// NP-Complete problems (intersection of NP and NP-Hard)
addProblemNode(4, 4, 1, 0xffcc00, 'NPC');     // SAT
addProblemNode(6, -2, 2, 0xffcc00, 'NPC');    // TSP
addProblemNode(3, 0, -3, 0xffcc00, 'NPC');    // Clique
addProblemNode(5, 2, -1, 0xffcc00, 'NPC');    // Vertex Cover
addProblemNode(7, -1, 0, 0xffcc00, 'NPC');    // Hamiltonian

// NP-Hard only (outside NP)
addProblemNode(18, 5, 3, 0xff4466, 'NPH');    // Halting Problem
addProblemNode(20, -3, -2, 0xff4466, 'NPH');  // TSP optimization
addProblemNode(16, 2, -4, 0xff4466, 'NPH');   // General optimization

// Reduction arrows between NP-Complete problems
const reductionGroup = new THREE.Group();
reductionGroup.visible = false;
classGroup.add(reductionGroup);

function addReduction(from, to, color) {
  const start = from.position.clone();
  const end = to.position.clone();
  const mid = start.clone().add(end).multiplyScalar(0.5);
  mid.y += 3;
  
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const pts = curve.getPoints(20);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity:0.6});
  const line = new THREE.Line(geo, mat);
  reductionGroup.add(line);
  
  // Arrowhead
  const arrowGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
  const arrowMat = new THREE.MeshPhongMaterial({color, emissive:color, emissiveIntensity:0.3});
  const arrow = new THREE.Mesh(arrowGeo, arrowMat);
  arrow.position.copy(end);
  arrow.lookAt(pts[pts.length - 2]);
  reductionGroup.add(arrow);
}

// Add reductions between NP-Complete problems (chain)
const npcProblems = problemNodes.filter(p => p.region === 'NPC');
for(let i = 0; i < npcProblems.length - 1; i++) {
  addReduction(npcProblems[i].mesh, npcProblems[i+1].mesh, 0xffcc00);
}

// P = NP? question visualization
const questionGroup = new THREE.Group();
questionGroup.visible = false;
scene.add(questionGroup);

// Create expanding/contracting animation elements
const qMark1 = new THREE.Mesh(
  new THREE.TorusGeometry(5, 1, 16, 32, Math.PI * 1.5),
  new THREE.MeshPhongMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.3, transparent:true, opacity:0})
);
qMark1.position.set(0, 10, 0);
questionGroup.add(qMark1);

const qDot = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 16, 16),
  new THREE.MeshPhongMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.5, transparent:true, opacity:0})
);
qDot.position.set(0, 2, 0);
questionGroup.add(qDot);

// Animation
camera.position.set(0, 10, 50);
camera.lookAt(0, 0, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [6, 5, 5, 5, 6, 6, 6]; // P, NP, NP-Hard, NPC, problems, reductions, P=NP?

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) phase = 0;
  }
  
  // Phase 0: Reveal P sphere
  if(phase >= 0) {
    pMat.opacity = Math.min(0.25, pMat.opacity + dt * 0.3);
    pWire.material.opacity = Math.min(0.4, pWire.material.opacity + dt * 0.3);
  }
  
  // Phase 1: Reveal NP sphere
  if(phase >= 1) {
    npMat.opacity = Math.min(0.15, npMat.opacity + dt * 0.2);
    npWire.material.opacity = Math.min(0.3, npWire.material.opacity + dt * 0.2);
  }
  
  // Phase 2: Reveal NP-Hard sphere
  if(phase >= 2) {
    npHardMat.opacity = Math.min(0.12, npHardMat.opacity + dt * 0.15);
    npHardWire.material.opacity = Math.min(0.25, npHardWire.material.opacity + dt * 0.15);
  }
  
  // Phase 3: NP-Complete intersection highlight
  if(phase >= 3) {
    npcMat.opacity = Math.min(0.5, npcMat.opacity + dt * 0.3);
    npcTorus.rotation.x = t * 0.3;
    npcTorus.rotation.z = t * 0.2;
  }
  
  // Phase 4: Reveal problem nodes
  if(phase >= 4) {
    problemNodes.forEach((pn, i) => {
      if(phaseTime > i * 0.3 || phase > 4) {
        pn.mesh.material.opacity = Math.min(0.9, pn.mesh.material.opacity + dt * 2);
        pn.mesh.rotation.y = t + i;
        pn.mesh.rotation.x = t * 0.5 + i;
        pn.mesh.position.y += Math.sin(t * 1.5 + i) * 0.01;
      }
    });
  }
  
  // Phase 5: Reductions
  if(phase >= 5) {
    reductionGroup.visible = true;
  }
  
  // Phase 6: P = NP?
  questionGroup.visible = (phase === 6);
  if(phase === 6) {
    qMark1.material.opacity = Math.min(0.8, phaseTime * 0.3);
    qDot.material.opacity = Math.min(0.8, phaseTime * 0.3);
    qMark1.rotation.z = Math.sin(t) * 0.1;
    qDot.scale.setScalar(1 + Math.sin(t * 3) * 0.3);
    
    // Pulse the P and NP spheres as if they might merge
    const pulse = Math.sin(t * 2) * 0.5;
    pSphere.position.x = -3 + pulse;
    pWire.position.x = -3 + pulse;
    npSphere.position.x = -2 + pulse * 0.5;
    npWire.position.x = -2 + pulse * 0.5;
  }
  
  // Camera orbits slowly
  const camAngle = t * 0.12;
  const camRadius = 45 + Math.sin(t * 0.2) * 10;
  camera.position.set(
    Math.cos(camAngle) * camRadius,
    12 + Math.sin(t * 0.3) * 5,
    Math.sin(camAngle) * camRadius
  );
  camera.lookAt(3, 0, 0);
  
  // Gentle rotation of the whole group
  classGroup.rotation.y = Math.sin(t * 0.05) * 0.1;
  
  pl.position.set(Math.sin(t * 0.5) * 25, 20, Math.cos(t * 0.5) * 25);
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
