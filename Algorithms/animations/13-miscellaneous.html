<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miscellaneous & Advanced Topics — Visual Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Chapter 13: Miscellaneous — Hashing (Chaining + Open Addressing) + Randomized Algorithms

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.005);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(20, 60, 30);
scene.add(dl);
const pl = new THREE.PointLight(0x4488ff, 0.8, 100);
scene.add(pl);

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(1200*3);
for(let i=0;i<3600;i++) pp[i]=(Math.random()-0.5)*250;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// ===== SCENE 1: Hash Table with Chaining =====
const hashGroup = new THREE.Group();
scene.add(hashGroup);

const tableSize = 7;
const slotWidth = 8;
const slotHeight = 5;
const tableStartX = -(tableSize * slotWidth) / 2;

// Hash table slots
const slots = [];
for(let i = 0; i < tableSize; i++) {
  const geo = new THREE.BoxGeometry(slotWidth * 0.9, slotHeight, 4);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x2a3a4a,
    emissive: 0x112233,
    emissiveIntensity: 0.1,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(tableStartX + i * slotWidth, 0, 0);
  hashGroup.add(mesh);
  slots.push({mesh, chain: []});
}

// Elements to insert: key → hash(key) = key % 7
const hashElements = [10, 22, 31, 4, 15, 28, 17, 59, 3, 40];
const insertedElements = [];

function hashInsert(key) {
  const idx = key % tableSize;
  const chainLen = slots[idx].chain.length;
  
  const size = 2;
  const geo = new THREE.SphereGeometry(size, 16, 16);
  const colors = [0xff4466, 0x44aaff, 0x44ff88, 0xffcc00, 0x8866ff, 0xff8844, 0x44ffcc, 0xff44aa, 0x88ff44, 0xffaa44];
  const color = colors[insertedElements.length % colors.length];
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.2,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Position: slot position + chain offset (going up)
  mesh.position.set(
    tableStartX + idx * slotWidth,
    slotHeight + chainLen * (size * 2 + 1) + size,
    0
  );
  hashGroup.add(mesh);
  slots[idx].chain.push(mesh);
  insertedElements.push({mesh, key, slot: idx, targetPos: mesh.position.clone(), startPos: new THREE.Vector3(0, 40, 0)});
  
  // Chain link line
  if(chainLen > 0) {
    const prevMesh = slots[idx].chain[chainLen - 1];
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      prevMesh.position.clone(),
      mesh.position.clone()
    ]);
    hashGroup.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color: 0x446688, transparent:true, opacity:0.5})));
  } else {
    // Connect to slot
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(tableStartX + idx * slotWidth, slotHeight/2, 0),
      mesh.position.clone()
    ]);
    hashGroup.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color: 0x446688, transparent:true, opacity:0.5})));
  }
}

// Hash function arrow (showing key → slot mapping)
const arrowGroup = new THREE.Group();
hashGroup.add(arrowGroup);

// ===== SCENE 2: Open Addressing (Linear Probing) =====
const openGroup = new THREE.Group();
openGroup.visible = false;
scene.add(openGroup);

const oTableSize = 11;
const oSlots = [];
const oSlotWidth = 6;
const oStartX = -(oTableSize * oSlotWidth) / 2;

for(let i = 0; i < oTableSize; i++) {
  const geo = new THREE.BoxGeometry(oSlotWidth * 0.85, 4, 4);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x2a3a4a,
    emissive: 0x112233,
    emissiveIntensity: 0.1
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(oStartX + i * oSlotWidth, 0, 0);
  openGroup.add(mesh);
  oSlots.push({mesh, occupied: false});
}

const oElements = [10, 22, 31, 4, 15, 28, 17, 59];
const oInserted = [];
let probePointer = null;

function createProbePointer() {
  const geo = new THREE.ConeGeometry(1, 2, 8);
  const mat = new THREE.MeshPhongMaterial({color:0xffcc00, emissive:0xffcc00, emissiveIntensity:0.5});
  probePointer = new THREE.Mesh(geo, mat);
  probePointer.rotation.z = Math.PI;
  probePointer.position.set(0, -5, 0);
  probePointer.visible = false;
  openGroup.add(probePointer);
}
createProbePointer();

function openInsert(key) {
  let idx = key % oTableSize;
  let probes = 0;
  
  while(oSlots[idx].occupied && probes < oTableSize) {
    idx = (idx + 1) % oTableSize;
    probes++;
  }
  
  if(!oSlots[idx].occupied) {
    oSlots[idx].occupied = true;
    const colors = [0xff4466, 0x44aaff, 0x44ff88, 0xffcc00, 0x8866ff, 0xff8844, 0x44ffcc, 0xff44aa];
    const color = colors[oInserted.length % colors.length];
    
    const geo = new THREE.SphereGeometry(2, 16, 16);
    const mat = new THREE.MeshPhongMaterial({
      color, emissive: color, emissiveIntensity: 0.2,
      transparent: true, opacity: 0
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(oStartX + idx * oSlotWidth, 5, 0);
    openGroup.add(mesh);
    oInserted.push({mesh, key, slot: idx, probes});
  }
}

// ===== SCENE 3: Randomized Algorithm — QuickSort Pivot Selection =====
const randGroup = new THREE.Group();
randGroup.visible = false;
scene.add(randGroup);

// Visualize random pivot selection as spinning roulette
const rouletteGeo = new THREE.TorusGeometry(12, 2, 16, 32);
const rouletteMat = new THREE.MeshPhongMaterial({
  color: 0x44aaff, emissive: 0x44aaff, emissiveIntensity: 0.15,
  transparent: true, opacity: 0.7
});
const roulette = new THREE.Mesh(rouletteGeo, rouletteMat);
randGroup.add(roulette);

// Elements on the roulette
const rouletteElements = [];
for(let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  const geo = new THREE.SphereGeometry(1.5, 16, 16);
  const mat = new THREE.MeshPhongMaterial({
    color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.2
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(Math.cos(angle) * 12, Math.sin(angle) * 12, 0);
  randGroup.add(mesh);
  rouletteElements.push({mesh, angle, baseAngle: angle});
}

// Pointer
const rPointer = new THREE.Mesh(
  new THREE.ConeGeometry(1, 3, 8),
  new THREE.MeshPhongMaterial({color:0xff4466, emissive:0xff4466, emissiveIntensity:0.5})
);
rPointer.position.set(0, 15, 0);
rPointer.rotation.z = Math.PI;
randGroup.add(rPointer);

// Animation
camera.position.set(0, 15, 50);
camera.lookAt(0, 5, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [14, 4, 12, 4, 10, 5]; // chaining, pause, open addr, pause, random, final
let insertIdx = 0;
let oInsertIdx = 0;
let lastInsert = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) {
      phase = 0;
      insertIdx = 0; oInsertIdx = 0;
      // Reset
      insertedElements.forEach(e => hashGroup.remove(e.mesh));
      insertedElements.length = 0;
      slots.forEach(s => { s.chain = []; });
      oInserted.forEach(e => openGroup.remove(e.mesh));
      oInserted.length = 0;
      oSlots.forEach(s => { s.occupied = false; });
    }
  }
  
  hashGroup.visible = (phase <= 1);
  openGroup.visible = (phase === 2 || phase === 3);
  randGroup.visible = (phase === 4 || phase === 5);
  
  // Phase 0: Hash table chaining
  if(phase === 0 && phaseTime - lastInsert > 1.2 && insertIdx < hashElements.length) {
    hashInsert(hashElements[insertIdx]);
    insertIdx++;
    lastInsert = phaseTime;
    
    // Flash the target slot
    const lastEl = insertedElements[insertedElements.length - 1];
    slots[lastEl.slot].mesh.material.emissive.setHex(0x44aaff);
    slots[lastEl.slot].mesh.material.emissiveIntensity = 0.4;
  }
  
  // Fade in and animate elements
  insertedElements.forEach(e => {
    e.mesh.material.opacity = Math.min(0.9, e.mesh.material.opacity + dt * 3);
  });
  
  // Reset slot glow
  slots.forEach(s => {
    s.mesh.material.emissiveIntensity *= 0.97;
  });
  
  if(phase === 0) {
    camera.position.set(Math.sin(t*0.15)*12, 18, 45);
    camera.lookAt(0, 8, 0);
  }
  
  // Phase 2: Open addressing
  if(phase === 2 && phaseTime - lastInsert > 1.5 && oInsertIdx < oElements.length) {
    openInsert(oElements[oInsertIdx]);
    oInsertIdx++;
    lastInsert = phaseTime;
    
    // Show probe pointer
    const lastEl = oInserted[oInserted.length - 1];
    probePointer.visible = true;
    probePointer.position.x = oStartX + lastEl.slot * oSlotWidth;
  }
  
  oInserted.forEach(e => {
    e.mesh.material.opacity = Math.min(0.9, e.mesh.material.opacity + dt * 3);
  });
  
  if(phase === 2) {
    camera.position.set(Math.sin(t*0.15)*10, 12, 42);
    camera.lookAt(0, 3, 0);
  }
  
  // Phase 4: Randomized — spinning roulette
  if(phase === 4) {
    const spinSpeed = Math.max(0.5, 5 - phaseTime * 0.3);
    rouletteElements.forEach((e, i) => {
      e.angle = e.baseAngle + t * spinSpeed;
      e.mesh.position.set(Math.cos(e.angle) * 12, Math.sin(e.angle) * 12, 0);
      
      // Highlight the one near the pointer
      const dist = Math.abs(e.mesh.position.y - 12);
      if(dist < 2) {
        e.mesh.material.color.setHex(0xff4466);
        e.mesh.material.emissive.setHex(0xff4466);
        e.mesh.material.emissiveIntensity = 0.5;
        e.mesh.scale.setScalar(1.5);
      } else {
        e.mesh.material.color.setHex(0xffcc00);
        e.mesh.material.emissive.setHex(0xffcc00);
        e.mesh.material.emissiveIntensity = 0.2;
        e.mesh.scale.setScalar(1);
      }
    });
    
    camera.position.set(Math.sin(t*0.2)*8, 5, 35);
    camera.lookAt(0, 0, 0);
  }
  
  // Transitions
  if(phase === 1 || phase === 3 || phase === 5) {
    const a = t * 0.4;
    camera.position.set(Math.cos(a)*50, 20, Math.sin(a)*50);
    camera.lookAt(0, 5, 0);
  }
  
  pl.position.set(Math.sin(t)*20, 25, Math.cos(t)*20);
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
