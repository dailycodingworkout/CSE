<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE Exam Strategy — Algorithm Overview Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
// Chapter 14: GATE Exam Strategy — All Algorithms Overview Dashboard

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.003);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.7);
dl.position.set(20, 60, 30);
scene.add(dl);
const pl = new THREE.PointLight(0x4488ff, 1, 200);
scene.add(pl);

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(2000*3);
for(let i=0;i<6000;i++) pp[i]=(Math.random()-0.5)*400;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// Algorithm topic nodes arranged in a galaxy/constellation
const topics = [
  {name:'Sorting', color:0xff4466, x:-30, y:20, z:-10, size:4, weight:0.15},
  {name:'Graph', color:0x44aaff, x:25, y:15, z:5, size:5, weight:0.18},
  {name:'DP', color:0x44ff88, x:-15, y:-10, z:15, size:4.5, weight:0.15},
  {name:'Greedy', color:0xffcc00, x:20, y:-15, z:-5, size:3.5, weight:0.10},
  {name:'D&C', color:0x8866ff, x:-25, y:5, z:-20, size:3, weight:0.08},
  {name:'Recurrence', color:0xff8844, x:0, y:25, z:10, size:3, weight:0.08},
  {name:'Asymptotic', color:0x44ffcc, x:30, y:0, z:15, size:3, weight:0.07},
  {name:'Strings', color:0xff44aa, x:-10, y:-25, z:-15, size:2.5, weight:0.05},
  {name:'Backtrack', color:0xaaff44, x:15, y:-25, z:10, size:2.5, weight:0.05},
  {name:'NP-Complete', color:0xff6644, x:-30, y:-20, z:5, size:3, weight:0.04},
  {name:'Hashing', color:0x66aaff, x:35, y:20, z:-15, size:2, weight:0.03},
  {name:'Amortized', color:0xffaa66, x:0, y:-30, z:-20, size:2, weight:0.02},
];

const topicMeshes = [];
const topicGroup = new THREE.Group();
scene.add(topicGroup);

topics.forEach((topic, i) => {
  // Main sphere
  const geo = new THREE.SphereGeometry(topic.size, 24, 24);
  const mat = new THREE.MeshPhongMaterial({
    color: topic.color,
    emissive: topic.color,
    emissiveIntensity: 0.15,
    transparent: true,
    opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(topic.x, topic.y, topic.z);
  topicGroup.add(mesh);
  
  // Orbit ring
  const ringGeo = new THREE.RingGeometry(topic.size * 1.3, topic.size * 1.5, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: topic.color, transparent: true, opacity: 0, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(mesh.position);
  topicGroup.add(ring);
  
  // Weight indicator (GATE question frequency)
  const weightH = topic.weight * 200;
  const wGeo = new THREE.BoxGeometry(2, weightH, 2);
  const wMat = new THREE.MeshPhongMaterial({
    color: topic.color, emissive: topic.color, emissiveIntensity: 0.2,
    transparent: true, opacity: 0
  });
  const wMesh = new THREE.Mesh(wGeo, wMat);
  wMesh.position.set(topic.x, -40 + weightH/2, topic.z);
  topicGroup.add(wMesh);
  
  topicMeshes.push({mesh, ring, weightBar: wMesh, topic, revealTime: i * 1.5});
});

// Connections between related topics
const connections = [
  [0, 4, 0.3],  // Sorting - D&C
  [1, 3, 0.4],  // Graph - Greedy
  [1, 2, 0.3],  // Graph - DP
  [2, 3, 0.2],  // DP - Greedy
  [4, 5, 0.3],  // D&C - Recurrence
  [5, 6, 0.3],  // Recurrence - Asymptotic
  [8, 9, 0.2],  // Backtrack - NP
  [1, 8, 0.2],  // Graph - Backtrack
  [0, 6, 0.2],  // Sorting - Asymptotic
  [2, 7, 0.15], // DP - Strings
];

const connLines = [];
connections.forEach(([a, b, strength]) => {
  const from = new THREE.Vector3(topics[a].x, topics[a].y, topics[a].z);
  const to = new THREE.Vector3(topics[b].x, topics[b].y, topics[b].z);
  const mid = from.clone().add(to).multiplyScalar(0.5);
  mid.y += 5;
  
  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const pts = curve.getPoints(20);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: 0x334466,
    transparent: true,
    opacity: 0
  });
  const line = new THREE.Line(geo, mat);
  topicGroup.add(line);
  connLines.push({line, strength, revealTime: Math.max(a, b) * 1.5 + 1});
});

// Time complexity comparison tower
const towerGroup = new THREE.Group();
towerGroup.visible = false;
scene.add(towerGroup);

const complexities = [
  {name:'O(1)', h:2, color:0x44ff88},
  {name:'O(log n)', h:5, color:0x44aaff},
  {name:'O(n)', h:10, color:0xffcc00},
  {name:'O(n log n)', h:18, color:0xff8844},
  {name:'O(n²)', h:30, color:0xff4466},
  {name:'O(n³)', h:45, color:0xff2244},
  {name:'O(2ⁿ)', h:60, color:0xff0044},
];

complexities.forEach((c, i) => {
  const geo = new THREE.CylinderGeometry(3, 3, c.h, 16);
  const mat = new THREE.MeshPhongMaterial({
    color: c.color, emissive: c.color, emissiveIntensity: 0.15,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(i * 8 - 24, c.h/2 - 25, 0);
  towerGroup.add(mesh);
});

// Spinning "success" vortex
const vortexGroup = new THREE.Group();
vortexGroup.visible = false;
scene.add(vortexGroup);

for(let i = 0; i < 200; i++) {
  const angle = (i / 200) * Math.PI * 10;
  const radius = i * 0.15 + 2;
  const y = i * 0.3 - 30;
  const geo = new THREE.SphereGeometry(0.5, 8, 8);
  const hue = (i / 200) * 0.3 + 0.3;
  const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.3,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  vortexGroup.add(mesh);
}

// Animation
camera.position.set(0, 10, 60);
camera.lookAt(0, 0, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [20, 4, 10, 4, 10, 5]; // topic galaxy, pause, complexity tower, pause, vortex, final

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) phase = 0;
  }
  
  topicGroup.visible = (phase <= 1);
  towerGroup.visible = (phase === 2 || phase === 3);
  vortexGroup.visible = (phase === 4 || phase === 5);
  
  // Phase 0: Topic galaxy reveal
  if(phase === 0) {
    topicMeshes.forEach(tm => {
      if(phaseTime > tm.revealTime) {
        tm.mesh.material.opacity = Math.min(0.85, tm.mesh.material.opacity + dt * 2);
        tm.ring.material.opacity = Math.min(0.3, tm.ring.material.opacity + dt);
        tm.weightBar.material.opacity = Math.min(0.7, tm.weightBar.material.opacity + dt);
        
        // Rotate ring
        tm.ring.lookAt(camera.position);
        tm.ring.rotation.z += dt * 0.5;
      }
    });
    
    connLines.forEach(cl => {
      if(phaseTime > cl.revealTime) {
        cl.line.material.opacity = Math.min(cl.strength, cl.line.material.opacity + dt * 0.3);
      }
    });
    
    // Float nodes
    topicMeshes.forEach((tm, i) => {
      tm.mesh.position.y = tm.topic.y + Math.sin(t + i * 0.7) * 1.5;
      tm.ring.position.copy(tm.mesh.position);
      tm.mesh.scale.setScalar(1 + Math.sin(t * 1.5 + i) * 0.08);
    });
    
    const camAngle = t * 0.1;
    camera.position.set(Math.cos(camAngle) * 65, 10 + Math.sin(t * 0.3) * 5, Math.sin(camAngle) * 65);
    camera.lookAt(0, 0, 0);
  }
  
  // Phase 2: Complexity tower
  if(phase === 2) {
    towerGroup.children.forEach((child, i) => {
      if(phaseTime > i * 1) {
        child.material.opacity = Math.min(0.8, child.material.opacity + dt * 2);
        child.material.emissiveIntensity = 0.15 + Math.sin(t * 2 + i) * 0.05;
      }
    });
    
    camera.position.set(Math.sin(t * 0.2) * 10, 5, 45);
    camera.lookAt(0, -5, 0);
  }
  
  // Phase 4: Success vortex
  if(phase === 4) {
    vortexGroup.children.forEach((child, i) => {
      child.material.opacity = Math.min(0.8, phaseTime * 0.5);
      
      // Spin
      const angle = (i / 200) * Math.PI * 10 + t * 2;
      const radius = i * 0.15 + 2;
      child.position.x = Math.cos(angle) * radius;
      child.position.z = Math.sin(angle) * radius;
    });
    
    camera.position.set(Math.sin(t * 0.3) * 15, phaseTime * 3, 30);
    camera.lookAt(0, 0, 0);
  }
  
  // Transitions
  if(phase === 1 || phase === 3 || phase === 5) {
    const a = t * 0.5;
    camera.position.set(Math.cos(a) * 60, 20, Math.sin(a) * 60);
    camera.lookAt(0, 0, 0);
  }
  
  // Gentle group rotation
  topicGroup.rotation.y = Math.sin(t * 0.03) * 0.1;
  
  pl.position.set(Math.sin(t * 0.5) * 30, 20, Math.cos(t * 0.5) * 30);
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
