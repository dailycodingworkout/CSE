<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greedy Algorithms — Visual Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Chapter 6: Greedy Algorithms
// Visualizes Activity Selection + Huffman Tree Building

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.005);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(20, 60, 30);
scene.add(dl);

// Particles
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(1200*3);
for(let i=0;i<3600;i++) pp[i]=(Math.random()-0.5)*250;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// ===== SCENE 1: Activity Selection =====
const actGroup = new THREE.Group();
scene.add(actGroup);

// Activities: (start, finish) sorted by finish time
const activities = [
  {s:1, f:2, c:0x44ff88},
  {s:3, f:4, c:0x44aaff},
  {s:0, f:6, c:0xff8844},
  {s:5, f:7, c:0xffcc00},
  {s:3, f:9, c:0xff4466},
  {s:5, f:9, c:0x8866ff},
  {s:6, f:10, c:0x44ffcc},
  {s:8, f:11, c:0xff44aa},
];

const timeScale = 6;
const actHeight = 2;
const actGap = 3;
const timelineStartX = -30;

// Timeline base
const tlGeo = new THREE.BoxGeometry(70, 0.3, 3);
const tlMat = new THREE.MeshPhongMaterial({color:0x334455});
const timeline = new THREE.Mesh(tlGeo, tlMat);
timeline.position.set(0, -2, 0);
actGroup.add(timeline);

// Tick marks
for(let t = 0; t <= 11; t++) {
  const tickGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
  const tick = new THREE.Mesh(tickGeo, new THREE.MeshPhongMaterial({color:0x556677}));
  tick.position.set(timelineStartX + t * timeScale, -1.5, 0);
  actGroup.add(tick);
}

// Activity bars
const actBars = [];
activities.forEach((act, i) => {
  const width = (act.f - act.s) * timeScale;
  const geo = new THREE.BoxGeometry(width, actHeight, actHeight);
  const mat = new THREE.MeshPhongMaterial({
    color: act.c,
    emissive: act.c,
    emissiveIntensity: 0.1,
    transparent: true,
    opacity: 0
  });
  const bar = new THREE.Mesh(geo, mat);
  bar.position.set(timelineStartX + (act.s + act.f)/2 * timeScale, i * actGap + 2, 0);
  actGroup.add(bar);
  actBars.push({mesh: bar, act, selected: false, index: i});
});

// Greedy selection order: activities sorted by finish, pick non-overlapping
const selectedActivities = [0, 1, 3, 7]; // indices of selected activities

// Selection pointer
const selPointer = new THREE.Mesh(
  new THREE.ConeGeometry(1, 2, 8),
  new THREE.MeshPhongMaterial({color:0x00ff88, emissive:0x00ff88, emissiveIntensity:0.5})
);
selPointer.rotation.z = Math.PI;
selPointer.position.set(0, -5, 0);
selPointer.visible = false;
actGroup.add(selPointer);

// ===== SCENE 2: Huffman Tree =====
const huffGroup = new THREE.Group();
huffGroup.visible = false;
scene.add(huffGroup);

// Huffman: characters with frequencies
// a:5, b:9, c:12, d:13, e:16, f:45
// Build tree bottom-up
const huffNodes = [];
const huffEdges = [];

function addHuffNode(x, y, z, size, color, freq) {
  const geo = new THREE.SphereGeometry(size, 20, 20);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.2,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  huffGroup.add(mesh);
  huffNodes.push({mesh, revealTime: 0, freq});
  return mesh;
}

function addHuffEdge(from, to) {
  const pts = [from.position.clone(), to.position.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({color:0x446688, transparent:true, opacity:0});
  const line = new THREE.Line(geo, mat);
  huffGroup.add(line);
  huffEdges.push({line, revealTime: 0});
  return line;
}

// Leaf nodes (bottom)
const leafY = -20;
const n_a = addHuffNode(-25, leafY, 0, 1.5, 0xff4466, 5);   // a:5
const n_b = addHuffNode(-15, leafY, 0, 2, 0xff8844, 9);     // b:9
const n_c = addHuffNode(-5, leafY, 0, 2.5, 0xffcc00, 12);    // c:12
const n_d = addHuffNode(5, leafY, 0, 2.7, 0x44ff88, 13);     // d:13
const n_e = addHuffNode(15, leafY, 0, 3, 0x44aaff, 16);      // e:16
const n_f = addHuffNode(25, leafY, 0, 4, 0x8866ff, 45);      // f:45

// Level 1: merge a+b = 14
const n_ab = addHuffNode(-20, leafY+12, 0, 2.5, 0xff6655, 14);
addHuffEdge(n_ab, n_a);
addHuffEdge(n_ab, n_b);

// Level 2: merge c+d = 25
const n_cd = addHuffNode(0, leafY+12, 0, 3, 0x88cc44, 25);
addHuffEdge(n_cd, n_c);
addHuffEdge(n_cd, n_d);

// Level 3: merge ab+e = 30
const n_abe = addHuffNode(-10, leafY+24, 0, 3.5, 0xff9966, 30);
addHuffEdge(n_abe, n_ab);
addHuffEdge(n_abe, n_e);

// Level 4: merge cd+abe = 55
const n_cdabe = addHuffNode(-5, leafY+36, 0, 4, 0xaacc66, 55);
addHuffEdge(n_cdabe, n_cd);
addHuffEdge(n_cdabe, n_abe);

// Level 5: merge f+rest = 100 (root)
const root = addHuffNode(5, leafY+48, 0, 5, 0xffffff, 100);
addHuffEdge(root, n_f);
addHuffEdge(root, n_cdabe);

// Set reveal times
huffNodes.forEach((n, i) => n.revealTime = i * 1.5);
huffEdges.forEach((e, i) => e.revealTime = i * 1.2 + 0.5);

// ===== SCENE 3: Fractional Knapsack =====
const knapGroup = new THREE.Group();
knapGroup.visible = false;
knapGroup.position.set(0, 0, 0);
scene.add(knapGroup);

// Knapsack bag
const bagGeo = new THREE.CylinderGeometry(8, 6, 20, 16, 1, true);
const bagMat = new THREE.MeshPhongMaterial({color:0x554433, transparent:true, opacity:0.5, side:THREE.DoubleSide});
const bag = new THREE.Mesh(bagGeo, bagMat);
bag.position.set(20, 10, 0);
knapGroup.add(bag);

// Items: sorted by value/weight ratio
const items = [
  {v:60, w:10, ratio:6, color:0xff4466, label:'A'},
  {v:100, w:20, ratio:5, color:0x44aaff, label:'B'},
  {v:120, w:30, ratio:4, color:0x44ff88, label:'C'},
];
const knapItems = [];
items.forEach((item, i) => {
  const size = item.w * 0.15 + 1;
  const geo = new THREE.BoxGeometry(size*2, size*2, size*2);
  const mat = new THREE.MeshPhongMaterial({
    color: item.color, emissive: item.color, emissiveIntensity:0.2,
    transparent:true, opacity:0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(-20 + i * 12, 5, 0);
  knapGroup.add(mesh);
  knapItems.push({mesh, item, taken: false, targetPos: new THREE.Vector3(20, 10 + i*3, 0)});
});

// Animation
camera.position.set(0, 20, 60);
camera.lookAt(0, 10, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [14, 4, 16, 4, 10, 5]; // activity, pause, huffman, pause, knapsack, final

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) phase = 0;
  }
  
  // Reset visibility
  actGroup.visible = (phase <= 1);
  huffGroup.visible = (phase === 2 || phase === 3);
  knapGroup.visible = (phase === 4 || phase === 5);
  
  // Phase 0: Activity Selection
  if(phase === 0) {
    // Reveal activities one by one
    actBars.forEach((ab, i) => {
      const revealT = i * 1;
      if(phaseTime > revealT) {
        ab.mesh.material.opacity = Math.min(0.8, ab.mesh.material.opacity + dt * 3);
      }
    });
    
    // Greedy selection
    const selectionPhase = phaseTime - 5;
    if(selectionPhase > 0) {
      selPointer.visible = true;
      const selIdx = Math.floor(selectionPhase / 2);
      
      selectedActivities.forEach((ai, si) => {
        if(si <= selIdx) {
          actBars[ai].mesh.material.emissiveIntensity = 0.5;
          actBars[ai].mesh.material.opacity = 1;
          actBars[ai].selected = true;
        }
      });
      
      // Dim non-selected after all selections done
      if(selIdx >= selectedActivities.length) {
        actBars.forEach(ab => {
          if(!ab.selected) {
            ab.mesh.material.opacity = 0.2;
          }
        });
      }
      
      const currentSel = selectedActivities[Math.min(selIdx, selectedActivities.length-1)];
      selPointer.position.x = actBars[currentSel].mesh.position.x;
      selPointer.position.y = actBars[currentSel].mesh.position.y - 3;
    }
    
    camera.position.set(-5 + Math.sin(t*0.15)*10, 20, 50);
    camera.lookAt(0, 10, 0);
  }
  
  // Phase 2: Huffman Tree
  if(phase === 2) {
    huffNodes.forEach(n => {
      if(phaseTime > n.revealTime) {
        n.mesh.material.opacity = Math.min(0.9, n.mesh.material.opacity + dt * 2);
        n.mesh.scale.setScalar(1 + Math.sin(t*2 + n.freq*0.1)*0.05);
      }
    });
    huffEdges.forEach(e => {
      if(phaseTime > e.revealTime) {
        e.line.material.opacity = Math.min(0.6, e.line.material.opacity + dt * 2);
      }
    });
    
    camera.position.set(Math.sin(t*0.2)*20, 10 + phaseTime*1.5, 50);
    camera.lookAt(0, 5, 0);
  }
  
  // Phase 4: Fractional Knapsack
  if(phase === 4) {
    bag.material.opacity = Math.min(0.5, phaseTime * 0.2);
    
    knapItems.forEach((ki, i) => {
      ki.mesh.material.opacity = Math.min(0.9, phaseTime * 0.5);
      const takeTime = 3 + i * 2.5;
      if(phaseTime > takeTime) {
        ki.mesh.position.lerp(ki.targetPos, dt * 1.5);
        ki.mesh.rotation.y += dt;
      }
    });
    
    camera.position.set(Math.sin(t*0.2)*15, 18, 45);
    camera.lookAt(5, 10, 0);
  }
  
  // Transition phases
  if(phase === 1 || phase === 3 || phase === 5) {
    const a = t * 0.5;
    camera.position.set(Math.cos(a)*60, 30, Math.sin(a)*60);
    camera.lookAt(0, 10, 0);
  }
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
