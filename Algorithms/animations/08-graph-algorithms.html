<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Algorithms — Visual Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
// Chapter 8: Graph Algorithms
// BFS level-by-level, DFS deep-first, MST growing, Dijkstra shortest path

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.004);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(20, 60, 30);
scene.add(dl);

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(1500*3);
for(let i=0;i<4500;i++) pp[i]=(Math.random()-0.5)*300;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// Graph definition
const graphNodes = [
  {id:0, x:0,  y:30, z:0},   // A
  {id:1, x:-20, y:18, z:5},  // B
  {id:2, x:20, y:18, z:-5},  // C
  {id:3, x:-30, y:5, z:10},  // D
  {id:4, x:-10, y:5, z:-5},  // E
  {id:5, x:10, y:5, z:5},    // F
  {id:6, x:30, y:5, z:-10},  // G
  {id:7, x:-20, y:-10, z:0}, // H
  {id:8, x:0,  y:-10, z:8},  // I
  {id:9, x:20, y:-10, z:-3}, // J
];

const graphEdges = [
  [0,1,4],[0,2,2],
  [1,3,5],[1,4,1],
  [2,5,3],[2,6,6],
  [3,7,2],[4,5,4],[4,8,3],
  [5,9,2],[6,9,1],
  [7,8,7],[8,9,5],
];

const COL_NODE_DEFAULT = 0x336699;
const COL_EDGE_DEFAULT = 0x223344;
const COL_BFS = [0xff4466, 0xff8844, 0xffcc00, 0x44ff88, 0x44aaff]; // level colors
const COL_DFS = 0x8866ff;
const COL_MST = 0x44ff88;
const COL_DIJKSTRA = 0xffcc00;

// Create node meshes
const nodeMeshes = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

graphNodes.forEach(n => {
  const geo = new THREE.SphereGeometry(2, 20, 20);
  const mat = new THREE.MeshPhongMaterial({
    color: COL_NODE_DEFAULT,
    emissive: COL_NODE_DEFAULT,
    emissiveIntensity: 0.15,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(n.x, n.y, n.z);
  nodeGroup.add(mesh);
  
  // Glow ring
  const ringGeo = new THREE.RingGeometry(2.5, 3, 32);
  const ringMat = new THREE.MeshBasicMaterial({color: COL_NODE_DEFAULT, transparent:true, opacity:0.2, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(mesh.position);
  nodeGroup.add(ring);
  
  nodeMeshes.push({mesh, ring, id: n.id, color: COL_NODE_DEFAULT});
});

// Create edge lines
const edgeMeshes = [];
graphEdges.forEach(([u, v, w]) => {
  const from = new THREE.Vector3(graphNodes[u].x, graphNodes[u].y, graphNodes[u].z);
  const to = new THREE.Vector3(graphNodes[v].x, graphNodes[v].y, graphNodes[v].z);
  
  // Tube instead of line for better visibility
  const curve = new THREE.LineCurve3(from, to);
  const geo = new THREE.TubeGeometry(curve, 1, 0.3, 8, false);
  const mat = new THREE.MeshPhongMaterial({
    color: COL_EDGE_DEFAULT,
    emissive: COL_EDGE_DEFAULT,
    emissiveIntensity: 0.05,
    transparent: true, opacity: 0.6
  });
  const mesh = new THREE.Mesh(geo, mat);
  nodeGroup.add(mesh);
  edgeMeshes.push({mesh, u, v, weight: w});
});

// BFS order (from node 0): level-by-level
const bfsOrder = [
  {nodes: [0], level: 0},
  {nodes: [1, 2], level: 1},
  {nodes: [3, 4, 5, 6], level: 2},
  {nodes: [7, 8, 9], level: 3},
];

// DFS order (from node 0)
const dfsOrder = [0, 1, 3, 7, 8, 4, 5, 9, 6, 2];

// MST edges (Kruskal's order by weight)
const mstEdges = [[4,1],[0,2],[6,9],[3,7],[5,9],[0,1],[2,5],[4,8],[1,4]]; // first 9 edges to connect 10 nodes

// Animation
camera.position.set(0, 20, 60);
camera.lookAt(0, 10, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [12, 4, 12, 4, 12, 5]; // BFS, pause, DFS, pause, MST/Dijkstra, final

function resetGraph() {
  nodeMeshes.forEach(n => {
    n.mesh.material.color.setHex(COL_NODE_DEFAULT);
    n.mesh.material.emissive.setHex(COL_NODE_DEFAULT);
    n.mesh.material.emissiveIntensity = 0.15;
    n.ring.material.color.setHex(COL_NODE_DEFAULT);
    n.ring.material.opacity = 0.2;
    n.mesh.scale.setScalar(1);
  });
  edgeMeshes.forEach(e => {
    e.mesh.material.color.setHex(COL_EDGE_DEFAULT);
    e.mesh.material.emissive.setHex(COL_EDGE_DEFAULT);
    e.mesh.material.emissiveIntensity = 0.05;
    e.mesh.material.opacity = 0.6;
  });
}

function colorNode(id, color, pulse) {
  const n = nodeMeshes[id];
  n.mesh.material.color.setHex(color);
  n.mesh.material.emissive.setHex(color);
  n.mesh.material.emissiveIntensity = 0.4;
  n.ring.material.color.setHex(color);
  n.ring.material.opacity = 0.5;
  if(pulse) n.mesh.scale.setScalar(1.5);
}

function colorEdge(u, v, color) {
  edgeMeshes.forEach(e => {
    if((e.u === u && e.v === v) || (e.u === v && e.v === u)) {
      e.mesh.material.color.setHex(color);
      e.mesh.material.emissive.setHex(color);
      e.mesh.material.emissiveIntensity = 0.3;
      e.mesh.material.opacity = 1;
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) phase = 0;
    resetGraph();
  }
  
  // Phase 0: BFS — wave-like expansion
  if(phase === 0) {
    bfsOrder.forEach(level => {
      const revealTime = level.level * 2.5;
      if(phaseTime > revealTime) {
        const col = COL_BFS[level.level % COL_BFS.length];
        level.nodes.forEach(nid => colorNode(nid, col, phaseTime - revealTime < 0.5));
      }
    });
    
    // Color BFS tree edges
    if(phaseTime > 2.5) colorEdge(0,1,COL_BFS[1]); colorEdge(0,2,COL_BFS[1]);
    if(phaseTime > 5) { colorEdge(1,3,COL_BFS[2]); colorEdge(1,4,COL_BFS[2]); colorEdge(2,5,COL_BFS[2]); colorEdge(2,6,COL_BFS[2]); }
    if(phaseTime > 7.5) { colorEdge(3,7,COL_BFS[3]); colorEdge(4,8,COL_BFS[3]); colorEdge(5,9,COL_BFS[3]); }
    
    camera.position.set(Math.sin(t*0.2)*15, 20 + Math.sin(t*0.3)*3, 55);
    camera.lookAt(0, 10, 0);
  }
  
  // Phase 2: DFS — deep-first exploration
  if(phase === 2) {
    const speed = 1;
    const revealed = Math.floor(phaseTime / speed);
    
    for(let i = 0; i <= Math.min(revealed, dfsOrder.length-1); i++) {
      colorNode(dfsOrder[i], COL_DFS, i === revealed);
      if(i > 0) {
        // Color edge between consecutive DFS nodes
        colorEdge(dfsOrder[i-1], dfsOrder[i], COL_DFS);
      }
    }
    
    // Camera follows DFS path
    if(revealed < dfsOrder.length) {
      const targetNode = graphNodes[dfsOrder[Math.min(revealed, dfsOrder.length-1)]];
      camera.position.lerp(new THREE.Vector3(targetNode.x + 20, targetNode.y + 15, targetNode.z + 40), dt * 1.5);
      camera.lookAt(targetNode.x, targetNode.y, targetNode.z);
    }
  }
  
  // Phase 4: MST — edges growing
  if(phase === 4) {
    const edgeSpeed = 1.2;
    const edgeCount = Math.floor(phaseTime / edgeSpeed);
    
    for(let i = 0; i < Math.min(edgeCount, mstEdges.length); i++) {
      const [u, v] = mstEdges[i];
      colorEdge(u, v, COL_MST);
      colorNode(u, COL_MST, false);
      colorNode(v, COL_MST, false);
    }
    
    // Latest edge pulses
    if(edgeCount < mstEdges.length && edgeCount > 0) {
      const [u, v] = mstEdges[edgeCount - 1];
      nodeMeshes[u].mesh.scale.setScalar(1 + Math.sin(t*4)*0.2);
      nodeMeshes[v].mesh.scale.setScalar(1 + Math.sin(t*4)*0.2);
    }
    
    const a = t * 0.2;
    camera.position.set(Math.cos(a)*55, 25, Math.sin(a)*55);
    camera.lookAt(0, 10, 0);
  }
  
  // Transition phases
  if(phase === 1 || phase === 3 || phase === 5) {
    const a = t * 0.4;
    camera.position.set(Math.cos(a)*65, 30, Math.sin(a)*65);
    camera.lookAt(0, 10, 0);
  }
  
  // Node float animation
  nodeMeshes.forEach((n, i) => {
    n.mesh.position.y = graphNodes[i].y + Math.sin(t + i) * 0.3;
    n.ring.position.copy(n.mesh.position);
    n.ring.lookAt(camera.position);
  });
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
