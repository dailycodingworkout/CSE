<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Matching Algorithms — Visual Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
// Chapter 10: String Matching — KMP pattern sliding animation

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.006);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(20, 60, 30);
scene.add(dl);

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(1200*3);
for(let i=0;i<3600;i++) pp[i]=(Math.random()-0.5)*250;
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x1a2a4a,size:0.5,transparent:true,opacity:0.3})));

// Text and Pattern
const text = "ABABDABACDABABCABAB";
const pattern = "ABABCABAB";

const cellW = 4;
const cellH = 5;
const cellD = 4;
const textStartX = -(text.length * cellW) / 2;

const COL_DEFAULT = 0x336699;
const COL_MATCH = 0x44ff88;
const COL_MISMATCH = 0xff4466;
const COL_PATTERN = 0x44aaff;
const COL_SKIP = 0xffcc00;
const COL_FOUND = 0x00ff88;

// Create text blocks
const textGroup = new THREE.Group();
scene.add(textGroup);

const textBlocks = [];
for(let i = 0; i < text.length; i++) {
  const geo = new THREE.BoxGeometry(cellW * 0.9, cellH, cellD);
  const mat = new THREE.MeshPhongMaterial({
    color: COL_DEFAULT,
    emissive: COL_DEFAULT,
    emissiveIntensity: 0.1,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(textStartX + i * cellW, 8, 0);
  textGroup.add(mesh);
  textBlocks.push({mesh, char: text[i]});
}

// Pattern blocks (movable)
const patternGroup = new THREE.Group();
scene.add(patternGroup);

const patternBlocks = [];
for(let i = 0; i < pattern.length; i++) {
  const geo = new THREE.BoxGeometry(cellW * 0.85, cellH * 0.85, cellD * 0.85);
  const mat = new THREE.MeshPhongMaterial({
    color: COL_PATTERN,
    emissive: COL_PATTERN,
    emissiveIntensity: 0.2,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(i * cellW, 0, 0);
  patternGroup.add(mesh);
  patternBlocks.push({mesh, char: pattern[i]});
}

patternGroup.position.set(textStartX, -2, 1);

// KMP failure function visualization
const lps = [0, 0, 1, 2, 0, 1, 2, 3, 4]; // LPS for "ABABCABAB"
const lpsGroup = new THREE.Group();
lpsGroup.visible = false;
scene.add(lpsGroup);

const lpsBars = [];
for(let i = 0; i < lps.length; i++) {
  const h = lps[i] * 3 + 0.5;
  const geo = new THREE.BoxGeometry(cellW * 0.8, h, cellD * 0.5);
  const color = lps[i] === 0 ? 0x334455 : new THREE.Color().setHSL(0.55 - lps[i]*0.1, 0.7, 0.5);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.15,
    transparent: true, opacity: 0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(textStartX + 15 + i * cellW, h/2 - 20, 0);
  lpsGroup.add(mesh);
  lpsBars.push({mesh, val: lps[i], revealTime: i * 0.6});
}

// Record KMP matching steps
const kmpSteps = [];
function recordKMP() {
  let i = 0, j = 0;
  while(i < text.length) {
    kmpSteps.push({shift: i - j, i, j, type: 'compare'});
    if(text[i] === pattern[j]) {
      kmpSteps.push({shift: i - j, i, j, type: 'match'});
      i++; j++;
      if(j === pattern.length) {
        kmpSteps.push({shift: i - j, i: i-1, j: j-1, type: 'found', foundAt: i - j});
        j = lps[j - 1];
      }
    } else {
      kmpSteps.push({shift: i - j, i, j, type: 'mismatch'});
      if(j !== 0) {
        const oldJ = j;
        j = lps[j - 1];
        kmpSteps.push({shift: i - j, i, j, type: 'kmp_skip', from: oldJ, to: j});
      } else {
        i++;
      }
    }
  }
}
recordKMP();

// Naive matching steps
const naiveSteps = [];
function recordNaive() {
  for(let s = 0; s <= text.length - pattern.length; s++) {
    for(let j = 0; j < pattern.length; j++) {
      naiveSteps.push({shift: s, j, type: text[s+j] === pattern[j] ? 'match' : 'mismatch'});
      if(text[s+j] !== pattern[j]) break;
      if(j === pattern.length - 1) {
        naiveSteps.push({shift: s, j, type: 'found', foundAt: s});
      }
    }
  }
}
recordNaive();

// Animation
camera.position.set(0, 15, 50);
camera.lookAt(0, 3, 0);

const clock = new THREE.Clock();
let phase = 0, phaseTime = 0;
const phaseDurs = [16, 4, 8, 4, 18, 5]; // naive, pause, LPS, pause, KMP, final
let stepIdx = 0;
const stepSpeed = 0.25;
let lastStep = 0;

function resetBlocks() {
  textBlocks.forEach(b => {
    b.mesh.material.color.setHex(COL_DEFAULT);
    b.mesh.material.emissive.setHex(COL_DEFAULT);
    b.mesh.material.emissiveIntensity = 0.1;
  });
  patternBlocks.forEach(b => {
    b.mesh.material.color.setHex(COL_PATTERN);
    b.mesh.material.emissive.setHex(COL_PATTERN);
    b.mesh.material.emissiveIntensity = 0.2;
  });
}

function applyStep(step, isKMP) {
  resetBlocks();
  
  // Move pattern to correct shift position
  const targetX = textStartX + step.shift * cellW;
  patternGroup.position.x += (targetX - patternGroup.position.x) * 0.3;
  
  if(step.type === 'match') {
    if(step.j < patternBlocks.length) {
      patternBlocks[step.j].mesh.material.color.setHex(COL_MATCH);
      patternBlocks[step.j].mesh.material.emissive.setHex(COL_MATCH);
    }
    const ti = step.shift + step.j;
    if(ti < textBlocks.length) {
      textBlocks[ti].mesh.material.color.setHex(COL_MATCH);
      textBlocks[ti].mesh.material.emissive.setHex(COL_MATCH);
    }
  }
  if(step.type === 'mismatch') {
    if(step.j < patternBlocks.length) {
      patternBlocks[step.j].mesh.material.color.setHex(COL_MISMATCH);
      patternBlocks[step.j].mesh.material.emissive.setHex(COL_MISMATCH);
      patternBlocks[step.j].mesh.material.emissiveIntensity = 0.4;
    }
    const ti = step.shift + step.j;
    if(ti < textBlocks.length) {
      textBlocks[ti].mesh.material.color.setHex(COL_MISMATCH);
      textBlocks[ti].mesh.material.emissive.setHex(COL_MISMATCH);
    }
  }
  if(step.type === 'found') {
    for(let k = 0; k < pattern.length; k++) {
      if(step.foundAt + k < textBlocks.length) {
        textBlocks[step.foundAt + k].mesh.material.color.setHex(COL_FOUND);
        textBlocks[step.foundAt + k].mesh.material.emissive.setHex(COL_FOUND);
        textBlocks[step.foundAt + k].mesh.material.emissiveIntensity = 0.5;
      }
      if(k < patternBlocks.length) {
        patternBlocks[k].mesh.material.color.setHex(COL_FOUND);
        patternBlocks[k].mesh.material.emissive.setHex(COL_FOUND);
      }
    }
  }
  if(step.type === 'kmp_skip') {
    // Show the smart skip with yellow
    patternBlocks.forEach(b => {
      b.mesh.material.color.setHex(COL_SKIP);
      b.mesh.material.emissive.setHex(COL_SKIP);
      b.mesh.material.emissiveIntensity = 0.3;
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  phaseTime += dt;
  
  if(phase < phaseDurs.length && phaseTime > phaseDurs[phase]) {
    phaseTime = 0;
    phase++;
    if(phase >= phaseDurs.length) phase = 0;
    stepIdx = 0;
    resetBlocks();
    patternGroup.position.x = textStartX;
  }
  
  lpsGroup.visible = (phase === 2 || phase === 3);
  
  // Phase 0: Naive matching
  if(phase === 0 && phaseTime - lastStep > stepSpeed && stepIdx < naiveSteps.length) {
    applyStep(naiveSteps[stepIdx], false);
    stepIdx++;
    lastStep = phaseTime;
  }
  
  // Phase 2: LPS array
  if(phase === 2) {
    resetBlocks();
    lpsBars.forEach(b => {
      if(phaseTime > b.revealTime) {
        b.mesh.material.opacity = Math.min(0.9, b.mesh.material.opacity + dt * 3);
      }
    });
    camera.position.lerp(new THREE.Vector3(0, 5, 40), dt * 2);
    camera.lookAt(0, -15, 0);
  }
  
  // Phase 4: KMP matching
  if(phase === 4 && phaseTime - lastStep > stepSpeed && stepIdx < kmpSteps.length) {
    applyStep(kmpSteps[stepIdx], true);
    stepIdx++;
    lastStep = phaseTime;
  }
  
  // Camera
  if(phase === 0 || phase === 4) {
    camera.position.set(Math.sin(t*0.15)*10, 12, 45);
    camera.lookAt(patternGroup.position.x + 15, 3, 0);
  }
  if(phase === 1 || phase === 3 || phase === 5) {
    const a = t * 0.3;
    camera.position.set(Math.cos(a)*50, 20, Math.sin(a)*50);
    camera.lookAt(0, 3, 0);
  }
  
  // Float animation
  patternBlocks.forEach((b, i) => {
    b.mesh.position.y = Math.sin(t*2 + i*0.3) * 0.2;
  });
  
  renderer.render(scene, camera);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
