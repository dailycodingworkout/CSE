<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --primary: #155799;
      --primary-dark: #0d3b66;
      --accent: #f4a261;
      --bg: #ffffff;
      --bg-alt: #f8f9fa;
      --text: #24292e;
      --text-light: #586069;
      --border: #e1e4e8;
      --code-bg: #f6f8fa;
      --success: #28a745;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 14px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: var(--text);
      line-height: 1.7;
      background: var(--bg);
    }

    /* Header */
    .site-header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 2rem 0;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .site-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .site-header h1 a {
      color: white;
      text-decoration: none;
    }

    .site-header nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .site-header nav a:hover { color: white; }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: var(--primary-dark);
      padding: 0.15rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    /* Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Main content */
    .main-content {
      padding: 2.5rem 0 4rem;
    }

    /* Typography */
    .main-content h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--primary-dark);
      border-bottom: 3px solid var(--primary);
      padding-bottom: 0.5rem;
    }

    .main-content h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
    }

    .main-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      color: var(--text);
    }

    .main-content h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
    }

    .main-content p {
      margin-bottom: 1rem;
    }

    .main-content a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .main-content a:hover {
      border-bottom-color: var(--primary);
    }

    .main-content strong {
      font-weight: 600;
    }

    .main-content hr {
      border: none;
      border-top: 2px solid var(--border);
      margin: 2rem 0;
    }

    /* Lists */
    .main-content ul, .main-content ol {
      margin: 0 0 1rem 1.5rem;
    }

    .main-content li {
      margin-bottom: 0.35rem;
    }

    .main-content li > ul, .main-content li > ol {
      margin-top: 0.25rem;
      margin-bottom: 0;
    }

    /* Tables */
    .main-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.92rem;
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .main-content thead {
      background: var(--primary);
      color: white;
    }

    .main-content th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .main-content td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .main-content tbody tr:nth-child(even) {
      background: var(--bg-alt);
    }

    .main-content tbody tr:hover {
      background: #e8f0fe;
    }

    /* Code */
    .main-content code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .main-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      line-height: 1.5;
    }

    .main-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85rem;
    }

    /* Blockquotes */
    .main-content blockquote {
      border-left: 4px solid var(--accent);
      background: #fff8f0;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text);
    }

    .main-content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Details/Summary */
    .main-content details {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      background: var(--bg-alt);
    }

    .main-content summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--primary);
      outline: none;
    }

    .main-content details[open] summary {
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    /* Chapter navigation */
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 1.5rem 0;
      margin-top: 3rem;
      border-top: 2px solid var(--border);
    }

    .chapter-nav a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.2rem;
      background: var(--primary);
      color: white !important;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      transition: background 0.2s, transform 0.15s;
      box-shadow: var(--shadow);
    }

    .chapter-nav a:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      border: none;
    }

    /* Checkmark list styling */
    .main-content ul li {
      list-style: disc;
    }

    /* Footer */
    .site-footer {
      background: var(--bg-alt);
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .site-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* Math display */
    .MathJax_Display {
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .site-header { padding: 1rem 0; }
      .site-header h1 { font-size: 1.2rem; }
      .site-header .container { flex-direction: column; align-items: flex-start; }
      .site-header nav { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .site-header nav a { margin-left: 0; margin-right: 1rem; }
      .main-content h1 { font-size: 1.6rem; }
      .main-content h2 { font-size: 1.3rem; }
      .container { padding: 0 1rem; }
      .main-content table { font-size: 0.8rem; }
      .main-content th, .main-content td { padding: 0.5rem 0.6rem; }
    }

    /* Print */
    @media print {
      .site-header, .site-footer, .chapter-nav { display: none; }
      .main-content { padding: 0; }
    }
  </style>
  <!-- MathJax 3 for LaTeX rendering -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1><a href="{{ '/' | relative_url }}">📘 {{ site.title }}</a><span class="badge">2026</span></h1>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/Aptitude/Seating-Arrangements/' | relative_url }}">Seating Arrangements</a>
        <a href="https://github.com/dailycodingworkout/CSE" target="_blank">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>GATE CSE Study Material &copy; 2026 &middot; Built for <strong>GATE · ESE · PSU · BANK</strong> exam aspirants</p>
      <p><a href="https://github.com/dailycodingworkout/CSE">View on GitHub</a></p>
    </div>
  </footer>

</body>
</html>
