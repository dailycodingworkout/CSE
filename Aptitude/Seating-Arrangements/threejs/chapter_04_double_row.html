<script>
"use strict";

/* ===== COLOR PALETTE ===== */
var TEAL = 0x1a8a8a, CORAL = 0xd94f4f, AMBER = 0xe8a317;
var INDIGO = 0x4a5da8, GREEN = 0x2e8b57;
var DARK = 0x333333, LGRAY = 0xdddddd;

var TEAL_S = "#1a8a8a", CORAL_S = "#d94f4f", AMBER_S = "#e8a317";
var INDIGO_S = "#4a5da8", GREEN_S = "#2e8b57";

/* ===== GLOBALS ===== */
var renderer, camera, controls, clock;
var currentScene = 0, totalScenes = 6;
var container = document.getElementById("canvas-container");
var labelPool = [];
var sceneGroup, activeScene;
var animState = { time: 0, phase: 0, data: {}, update: null };

/* ===== RENDERER SETUP ===== */
function initRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setClearColor(0xf8f8f8);
  container.appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(
    50, container.clientWidth / container.clientHeight, 0.1, 200
  );
  camera.position.set(0, 8, 18);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 4;
  controls.maxDistance = 60;
  clock = new THREE.Clock();
}

function onResize() {
  var w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", onResize);

/* ===== LABEL SYSTEM ===== */
function clearLabels() {
  for (var i = 0; i < labelPool.length; i++) labelPool[i].el.remove();
  labelPool.length = 0;
}

function addLabel(text, obj, offsetY, cls) {
  var el = document.createElement("div");
  el.className = "label-overlay" + (cls ? " " + cls : "");
  el.textContent = text;
  container.appendChild(el);
  labelPool.push({ el: el, obj: obj, offsetY: offsetY || 0 });
  return el;
}

function updateLabels() {
  var w = container.clientWidth, h = container.clientHeight;
  var v = new THREE.Vector3();
  for (var i = 0; i < labelPool.length; i++) {
    var l = labelPool[i];
    if (!l.obj || !l.obj.parent) { l.el.style.display = "none"; continue; }
    l.obj.getWorldPosition(v);
    v.y += l.offsetY;
    v.project(camera);
    if (v.z > 1) { l.el.style.display = "none"; continue; }
    l.el.style.display = "";
    l.el.style.left = ((v.x * 0.5 + 0.5) * w) + "px";
    l.el.style.top = ((-v.y * 0.5 + 0.5) * h) + "px";
  }
}

/* ===== GEOMETRY HELPERS ===== */
function mat(color, em) {
  return new THREE.MeshPhongMaterial({ color: color, emissive: em || 0, shininess: 60 });
}
function matT(color, op) {
  return new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: op, shininess: 40 });
}
function lineMat(color) {
  return new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
}
function dashedLineMat(color) {
  return new THREE.LineDashedMaterial({ color: color, linewidth: 2, dashSize: 0.3, gapSize: 0.15 });
}
function makeBox(w, h, d, c) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
}
function makeSphere(r, c) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 24, 24), mat(c));
}
function makeCyl(rt, rb, h, c) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 24), mat(c));
}
function makeLine(a, b, c) {
  var g = new THREE.BufferGeometry().setFromPoints([a, b]);
  return new THREE.Line(g, lineMat(c));
}
function makeDashedLine(a, b, c) {
  var g = new THREE.BufferGeometry().setFromPoints([a, b]);
  var line = new THREE.Line(g, dashedLineMat(c));
  line.computeLineDistances();
  return line;
}
function makeArrow(from, to, c, hl) {
  var dir = new THREE.Vector3().subVectors(to, from);
  var len = dir.length(); dir.normalize();
  return new THREE.ArrowHelper(dir, from, len, c, hl || 0.4, 0.2);
}

function makeChair(x, y, z) {
  var g = new THREE.Group();
  var seat = makeBox(1.0, 0.12, 0.9, 0xcccccc);
  g.add(seat);
  var back = makeBox(1.0, 0.8, 0.1, 0xbbbbbb);
  back.position.set(0, 0.4, -0.4);
  g.add(back);
  var legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8);
  var legM = mat(0x999999);
  [[-0.38, -0.31, -0.32], [0.38, -0.31, -0.32],
   [-0.38, -0.31, 0.32], [0.38, -0.31, 0.32]].forEach(function(o) {
    var leg = new THREE.Mesh(legGeo, legM);
    leg.position.set(o[0], o[1], o[2]);
    g.add(leg);
  });
  g.position.set(x, y, z);
  return g;
}

function makePerson(x, y, z, color) {
  var g = new THREE.Group();
  var body = makeCyl(0.25, 0.25, 0.7, color);
  body.position.set(0, 0.35, 0);
  g.add(body);
  var head = makeSphere(0.22, color);
  head.position.set(0, 0.85, 0);
  g.add(head);
  g.position.set(x, y, z);
  return g;
}

/* ===== LIGHTING ===== */
function addLights(sc) {
  sc.add(new THREE.AmbientLight(0xffffff, 0.55));
  var d1 = new THREE.DirectionalLight(0xffffff, 0.65);
  d1.position.set(8, 12, 10); sc.add(d1);
  var d2 = new THREE.DirectionalLight(0xffffff, 0.3);
  d2.position.set(-6, 8, -8); sc.add(d2);
}

function easeOut(t) { t = Math.min(1, Math.max(0, t)); return 1 - Math.pow(1 - t, 3); }

/* ===== SCENE INFO ===== */
var sceneInfo = [
  {
    title: "Scene 1: Double Row Construction",

  {

    body: "<h3>LEFT/RIGHT Reverse Between Rows!</h3>" +

      "screen directions in the two rows because people face opposite ways!</div>" +
      "<ul>" +
      "<li><b>Row 1 (facing South):</b> Left = increasing position (→ on screen)</li>" +
      "<li><b>Row 2 (facing North):</b> Left = decreasing position (← on screen)</li>" +

      "<h3>Formula Table</h3>" +
      "<ul>" +
      "<li>Row 1 (South): k left → p+k, k right → p−k</li>" +

      "</ul>" +
      "<div class=\"key-point\">SAME WORD 'LEFT' → OPPOSITE DIRECTIONS in different rows! " +
      "Always determine which row the person is in FIRST.</div>"
  },
  {
    title: "Scene 3: Facing Pairs",
    header: "Understanding Facing Relationships",
    body: "<h3>Facing = Same Position, Different Row</h3>" +
      "<p>When a problem states \"A faces B\", it means:</p>" +
      "<ul>" +
      "<li>A and B are in <b>different</b> rows</li>" +
      "<li>They are at the <b>same</b> position number</li>" +
      "<li>They directly look at each other across the gap</li>" +
      "</ul>" +
      "<div class=\"key-point\">Facing = Same position number, Different rows. " +
      "This is distinct from \"adjacent\" which means same row, next position.</div>" +
      "<p>Watch the facing pair lines connect corresponding positions.</p>"
  },
  {
    title: "Scene 4: Cross-Row Constraint Chaining",
    header: "Cross-Row Constraint Propagation",
    body: "<h3>How Clues Cascade Across Rows</h3>" +
      "<p>Placing someone in one row can determine positions in the other:</p>" +

      "<li>\"B is at Row 1 position 3\" → Place B</li>" +

      "<li>\"S is to the left of R\" → Row 2 facing north, left = pos 2</li>" +

      "<li>S is immediate left of R → Row 2 north, left = pos 2 → S at pos 2</li>" +
      "<li>D not adjacent to A → D not at pos 1 or 3 → D at pos 4, C at pos 1</li>" +

      "'Adjacent' = same row, next seat</li>" +

];

/* ===== NAVIGATION ===== */
function updateNav() {
  document.getElementById("counter").textContent =
    "Scene " + (currentScene + 1) + " of " + totalScenes;
  document.getElementById("btn-prev").disabled = (currentScene === 0);
  document.getElementById("btn-next").disabled = (currentScene === totalScenes - 1);
  var s = sceneInfo[currentScene];
  document.getElementById("scene-title").textContent = s.title;
  document.getElementById("info-header").textContent = s.header;
  document.getElementById("info-body").innerHTML = s.body;
}
function nextScene() { if (currentScene < totalScenes - 1) { currentScene++; loadScene(currentScene); } }
function prevScene() { if (currentScene > 0) { currentScene--; loadScene(currentScene); } }
document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") nextScene();
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") prevScene();
});

/* ===== SCENE LOADER ===== */
function loadScene(idx) {
  clearLabels();
  activeScene = new THREE.Scene();
  activeScene.background = new THREE.Color(0xf8f8f8);
  addLights(activeScene);
  sceneGroup = new THREE.Group();
  activeScene.add(sceneGroup);
  animState = { time: 0, phase: 0, data: {}, update: null };
  [buildScene1, buildScene2, buildScene3,
   buildScene4, buildScene5, buildScene6][idx]();
  updateNav();
}

/* ===========================================================
   SCENE 1 -- Double Row Construction
   =========================================================== */
function buildScene1() {
  camera.position.set(0, 10, 16);
  controls.target.set(0, 1, 0);
  controls.update();

  var spacing = 2.2;
  var rowZ1 = -2.5, rowZ2 = 2.5;
  var row1Chairs = [], row2Chairs = [], row1Labels = [], row2Labels = [];

  // Row 1 chairs (facing south — backrest toward north/negative-z)
  for (var i = 0; i < 4; i++) {
    var x = (i - 1.5) * spacing;
    var ch = makeChair(x, 0, rowZ1);
    ch.rotation.y = Math.PI; // face south
    ch.scale.set(0, 0, 0);
    sceneGroup.add(ch);
    row1Chairs.push(ch);
    var pAnc = new THREE.Object3D();
    pAnc.position.set(x, 0.9, rowZ1);
    sceneGroup.add(pAnc);
    row1Labels.push(addLabel("P" + (i + 1), pAnc, 0, "box-label"));
  }

  // Row 2 chairs (facing north — backrest toward south/positive-z)
  for (var j = 0; j < 4; j++) {
    var x2 = (j - 1.5) * spacing;
    var ch2 = makeChair(x2, 0, rowZ2);
    ch2.scale.set(0, 0, 0);
    sceneGroup.add(ch2);
    row2Chairs.push(ch2);
    var pAnc2 = new THREE.Object3D();
    pAnc2.position.set(x2, 0.9, rowZ2);
    sceneGroup.add(pAnc2);
    row2Labels.push(addLabel("P" + (j + 1), pAnc2, 0, "box-label"));
  }

  // Row labels
  var r1Anc = new THREE.Object3D();
  r1Anc.position.set(5.5, 0.5, rowZ1);
  sceneGroup.add(r1Anc);
  var r1Lbl = addLabel("Row 1 — Facing South ↓", r1Anc, 0, "box-label");
  r1Lbl.style.display = "none";

  var r2Anc = new THREE.Object3D();
  r2Anc.position.set(5.5, 0.5, rowZ2);
  sceneGroup.add(r2Anc);
  var r2Lbl = addLabel("Row 2 — Facing North ↑", r2Anc, 0, "box-label");
  r2Lbl.style.display = "none";

  // Direction arrows (appear later)
  var dirArrow1 = makeArrow(
    new THREE.Vector3(0, 1.5, rowZ1),
    new THREE.Vector3(0, 1.5, rowZ1 + 2), CORAL, 0.4
  );
  dirArrow1.visible = false;
  sceneGroup.add(dirArrow1);

  var dirArrow2 = makeArrow(
    new THREE.Vector3(0, 1.5, rowZ2),
    new THREE.Vector3(0, 1.5, rowZ2 - 2), TEAL, 0.4
  );
  dirArrow2.visible = false;
  sceneGroup.add(dirArrow2);

  // Table between rows
  var table = makeBox(8, 0.1, 2, 0xe0d5c0);
  table.position.set(0, -0.2, 0);
  table.scale.set(0, 0, 0);
  sceneGroup.add(table);

  // Floor
  var floor = makeBox(14, 0.04, 10, 0xf2f2f2);
  floor.position.set(0, -0.58, 0);
  sceneGroup.add(floor);

  // Convention label
  var convAnc = new THREE.Object3D();
  convAnc.position.set(0, 3.5, 0);
  sceneGroup.add(convAnc);
  var convLbl = addLabel(
    "Two rows face EACH OTHER — standard convention in Banking exams",
    convAnc, 0, "highlight-label"
  );
  convLbl.style.display = "none";

  animState.data = {
    row1Chairs: row1Chairs, row2Chairs: row2Chairs,
    r1Lbl: r1Lbl, r2Lbl: r2Lbl,
    dirArrow1: dirArrow1, dirArrow2: dirArrow2,
    table: table, convLbl: convLbl
  };

  animState.update = function(dt) {
    animState.time += dt;
    var t = animState.time, d = animState.data;

    // Phase 1: Row 1 chairs appear (0-2s)
    for (var i = 0; i < 4; i++) {
      var e1 = t - i * 0.35;
      if (e1 > 0) {
        var s1 = easeOut(e1 / 0.5);
        d.row1Chairs[i].scale.set(s1, s1, s1);
      }
    }

    // Phase 2: Table appears (1.5s)
    if (t > 1.5) {
      var ts = easeOut((t - 1.5) / 0.6);
      d.table.scale.set(ts, ts, ts);
    }

    // Phase 3: Row 2 chairs appear (2.5s)
    for (var j = 0; j < 4; j++) {
      var e2 = t - 2.5 - j * 0.35;
      if (e2 > 0) {
        var s2 = easeOut(e2 / 0.5);
        d.row2Chairs[j].scale.set(s2, s2, s2);
      }
    }

    // Phase 4: Row labels (4s)
    if (t > 4) {
      d.r1Lbl.style.display = "";
      d.r2Lbl.style.display = "";
    }

    // Phase 5: Direction arrows (5s)
    if (t > 5) {
      d.dirArrow1.visible = true;
      d.dirArrow2.visible = true;
    }

    // Phase 6: Convention label (6.5s)
    if (t > 6.5) {
      d.convLbl.style.display = "";
    }
  };
}

/* ===========================================================
   SCENE 2 -- The Direction Reversal Trap
   =========================================================== */
function buildScene2() {
  camera.position.set(0, 12, 18);
  controls.target.set(0, 1, 0);
  controls.update();

  var spacing = 2.2;
  var rowZ1 = -3, rowZ2 = 3;

  // Row 1: 4 chairs facing south
  for (var i = 0; i < 4; i++) {
    var x = (i - 1.5) * spacing;

  );

  floor.position.set(0, -0.58, 0);
  sceneGroup.add(floor);

  animState.data = {
    r1LeftArrow: r1LeftArrow, r2LeftArrow: r2LeftArrow,
    r1LeftLbl: r1LeftLbl, r2LeftLbl: r2LeftLbl,
    trapLbl: trapLbl, fLbl1: fLbl1, fLbl2: fLbl2,
    person1: person1, person2: person2
  };

  animState.update = function(dt) {
    animState.time += dt;
    var t = animState.time, d = animState.data;

    // Pulse persons
    var pulse = 1 + 0.05 * Math.sin(t * 4);
    d.person1.scale.set(pulse, pulse, pulse);
    d.person2.scale.set(pulse, pulse, pulse);

    // Phase 1: Row 1 left arrow (2s)
    if (t > 2) {
      d.r1LeftArrow.visible = true;
      d.r1LeftLbl.style.display = "";
    }

    // Phase 2: Row 2 left arrow (5s)
    if (t > 5) {
      d.r2LeftArrow.visible = true;
      d.r2LeftLbl.style.display = "";
    }

    // Phase 3: Trap warning (8s)
    if (t > 8) {
      d.trapLbl.style.display = "";
      // Make it pulse red
      var tp = 0.6 + 0.4 * Math.sin(t * 3);
      d.trapLbl.style.opacity = tp;
    }

    // Phase 4: Formula table (10s)
    if (t > 10) {
      d.fLbl1.style.display = "";
      d.fLbl2.style.display = "";
    }
  };
}

  );

  var cascArrow2 = makeDashedLine(
    new THREE.Vector3(slots1[2], 0.5, rowZ1 + 0.6),
    new THREE.Vector3(slots2[2], 0.5, rowZ2 - 0.6),
    GREEN
  );
  cascArrow2.visible = false;
  sceneGroup.add(cascArrow2);

  var cascArrow3 = makeArrow(
    new THREE.Vector3(slots2[2] - 0.4, 0.7, rowZ2),
    new THREE.Vector3(slots2[1] + 0.4, 0.7, rowZ2),
    GREEN, 0.3
  );
  cascArrow3.visible = false;
  sceneGroup.add(cascArrow3);

  // Arrow 4: B → A (right in Row 1)
  var cascArrow4 = makeArrow(
    new THREE.Vector3(slots1[2] - 0.4, 0.7, rowZ1),
    new THREE.Vector3(slots1[1] + 0.4, 0.7, rowZ1),
    GREEN, 0.3
  );
  cascArrow4.visible = false;
  sceneGroup.add(cascArrow4);

  // Step constraint labels
  var steps = [
    { text: "Step 1: B at Row 1 pos 3", time: 1.5 },
    { text: "Step 2: R faces B → R at Row 2 pos 3", time: 5 },
    { text: "Step 3: S left of R (Row 2 north) → S at pos 2", time: 9 },
    { text: "Step 4: A right of B (Row 1 south) → A at pos 2", time: 13 }
  ];
  var stepAnc = new THREE.Object3D();
  stepAnc.position.set(0, 5, 0);
  sceneGroup.add(stepAnc);
  var stepLbl = addLabel("", stepAnc, 0, "highlight-label");

  // Bottom label
  var bottomAnc = new THREE.Object3D();
  bottomAnc.position.set(0, -2, 0);
  sceneGroup.add(bottomAnc);
  var bottomLbl = addLabel(
    "Cross-row constraints are the FASTEST way to solve — process 'faces' clues FIRST",
    bottomAnc, 0, "box-label"
  );
  bottomLbl.style.color = GREEN_S;
  bottomLbl.style.display = "none";

  // Floor
  var floor = makeBox(16, 0.04, 12, 0xf2f2f2);
  floor.position.set(0, -0.58, 0);
  sceneGroup.add(floor);

  animState.data = {
    personB: personB, personR: personR, personS: personS, personA: personA,
    bLbl: bLbl, rLbl: rLbl, sLbl: sLbl, aLbl: aLbl,
    cascArrow2: cascArrow2, cascArrow3: cascArrow3, cascArrow4: cascArrow4,
    stepLbl: stepLbl, steps: steps, bottomLbl: bottomLbl
  };

  animState.update = function(dt) {
    animState.time += dt;
    var t = animState.time, d = animState.data;

    // Update step label
    var currentStep = "";
    for (var i = d.steps.length - 1; i >= 0; i--) {
      if (t > d.steps[i].time) { currentStep = d.steps[i].text; break; }
    }
    d.stepLbl.textContent = currentStep;

    // Step 1: Place B (1.5s)
    if (t > 1.5) {
      var s1 = easeOut((t - 1.5) / 0.6);
      d.personB.scale.set(s1, s1, s1);
      d.bLbl.style.display = "";
    }

    // Step 2: Place R + facing line (5s)
    if (t > 5) {
      var s2 = easeOut((t - 5) / 0.6);
      d.personR.scale.set(s2, s2, s2);
      d.rLbl.style.display = "";
      d.cascArrow2.visible = true;
    }

    // Step 3: Place S + arrow from R (9s)
    if (t > 9) {
      var s3 = easeOut((t - 9) / 0.6);
      d.personS.scale.set(s3, s3, s3);
      d.sLbl.style.display = "";
      d.cascArrow3.visible = true;
    }

    // Step 4: Place A + arrow from B (13s)
    if (t > 13) {
      var s4 = easeOut((t - 13) / 0.6);
      d.personA.scale.set(s4, s4, s4);
      d.aLbl.style.display = "";
      d.cascArrow4.visible = true;
    }

    // Bottom label (16s)
    if (t > 16) {
      d.bottomLbl.style.display = "";
    }
  };
}

  descAnc.position.set(0, 5, 0);
  sceneGroup.add(descAnc);
  var descLbl = addLabel("", descAnc, 0, "highlight-label");

  // Checkmarks
  var checkAnc = new THREE.Object3D();
  checkAnc.position.set(0, -2, 0);
  sceneGroup.add(checkAnc);
  var checkLbl = addLabel("", checkAnc, 0, "box-label");
  checkLbl.style.color = GREEN_S;
  checkLbl.style.fontSize = "16px";

  // Floor
  var floor = makeBox(16, 0.04, 12, 0xf2f2f2);
  floor.position.set(0, -0.58, 0);
  sceneGroup.add(floor);

  animState.data = {
    placementSteps: placementSteps,
    personMeshes: personMeshes,
    personLbls: personLbls,
    faceLine: faceLine,
    descLbl: descLbl, checkLbl: checkLbl
  };

  animState.update = function(dt) {
    animState.time += dt;
    var t = animState.time, d = animState.data;

    // Place people step by step
    var currentDesc = "";
    var placedCount = 0;
    for (var i = 0; i < d.placementSteps.length; i++) {
      var step = d.placementSteps[i];
      if (t > step.time) {
        var elapsed = t - step.time;
        var sc = easeOut(elapsed / 0.5);
        d.personMeshes[i].scale.set(sc, sc, sc);
        d.personLbls[i].style.display = "";
        currentDesc = step.desc;
        placedCount++;
      }
    }
    d.descLbl.textContent = currentDesc;

    // Show facing line after step 2
    if (t > 5.5) d.faceLine.visible = true;

    // Show final verification
    if (placedCount === d.placementSteps.length && t > 20) {
      d.checkLbl.textContent = "✓ All constraints verified — Row 1: [C, A, B, D] | Row 2: [P, S, R, Q]";
    }
  };
}

/* ===========================================================
   SCENE 6 -- Common Traps Catalogue
   =========================================================== */
function buildScene6() {
  camera.position.set(0, 8, 20);
  controls.target.set(0, 2.5, 0);
  controls.update();

  var trapY = [7, 3.5, 0, -3.5];
  var trapColors = [CORAL, AMBER, INDIGO, TEAL];
  var trapTitles = [
    "Trap 1: Left/Right Confusion",
    "Trap 2: Faces vs Adjacent",
    "Trap 3: Assuming Row Assignment",
    "Trap 4: Diagonal Confusion"
  ];

  var trapBoxes = [], wrongLabels = [], correctLabels = [];

  for (var i = 0; i < 4; i++) {
    // Trap title box
    var tBox = makeBox(4, 0.8, 0.8, trapColors[i]);
    tBox.position.set(-5, trapY[i], 0);
    tBox.scale.set(0, 0, 0);
    sceneGroup.add(tBox);
    addLabel(trapTitles[i], tBox, 0.7, "box-label");
    trapBoxes.push(tBox);
  }

  // Trap 1: Left/Right Confusion
  // Wrong: placing left of person in Row 2 going right on screen
  var t1WrongAnc = new THREE.Object3D();
  t1WrongAnc.position.set(0, trapY[0] + 0.5, 0);
  sceneGroup.add(t1WrongAnc);
  var t1w = addLabel("✗ Row 2 'left' → placed rightward on screen", t1WrongAnc, 0, "trap-label");
  t1w.style.display = "none";
  wrongLabels.push(t1w);

  var t1CorrectAnc = new THREE.Object3D();
  t1CorrectAnc.position.set(0, trapY[0] - 0.5, 0);
  sceneGroup.add(t1CorrectAnc);
  var t1c = addLabel("✓ Row 2 (north): left = leftward on screen (decreasing pos)", t1CorrectAnc, 0, "box-label");
  t1c.style.color = GREEN_S;
  t1c.style.display = "none";
  correctLabels.push(t1c);

  // Wrong indicator sphere (red)
  var t1ws = makeSphere(0.25, CORAL);
  t1ws.position.set(4, trapY[0] + 0.5, 0);
  t1ws.visible = false;
  sceneGroup.add(t1ws);

  // Correct indicator sphere (green)
  var t1cs = makeSphere(0.25, GREEN);
  t1cs.position.set(4, trapY[0] - 0.5, 0);
  t1cs.visible = false;
  sceneGroup.add(t1cs);

  // Trap 2: Faces vs Adjacent
  var t2WrongAnc = new THREE.Object3D();
  t2WrongAnc.position.set(0, trapY[1] + 0.5, 0);
  sceneGroup.add(t2WrongAnc);
  var t2w = addLabel("✗ 'A faces B' → placed A next to B in SAME row", t2WrongAnc, 0, "trap-label");
  t2w.style.display = "none";
  wrongLabels.push(t2w);

  var t2CorrectAnc = new THREE.Object3D();
  t2CorrectAnc.position.set(0, trapY[1] - 0.5, 0);
  sceneGroup.add(t2CorrectAnc);
  var t2c = addLabel("✓ 'Faces' = opposite row, same position; 'Adjacent' = same row", t2CorrectAnc, 0, "box-label");
  t2c.style.color = GREEN_S;
  t2c.style.display = "none";
  correctLabels.push(t2c);

  var t2ws = makeSphere(0.25, CORAL);
  t2ws.position.set(6, trapY[1] + 0.5, 0);
  t2ws.visible = false;
  sceneGroup.add(t2ws);

  var t2cs = makeSphere(0.25, GREEN);
  t2cs.position.set(6, trapY[1] - 0.5, 0);
  t2cs.visible = false;
  sceneGroup.add(t2cs);

  // Trap 3: Assuming Row Assignment
  var t3WrongAnc = new THREE.Object3D();
  t3WrongAnc.position.set(0, trapY[2] + 0.5, 0);
  sceneGroup.add(t3WrongAnc);
  var t3w = addLabel("✗ Assumed X is in Row 1 without evidence", t3WrongAnc, 0, "trap-label");
  t3w.style.display = "none";
  wrongLabels.push(t3w);

  var t3CorrectAnc = new THREE.Object3D();
  t3CorrectAnc.position.set(0, trapY[2] - 0.5, 0);
  sceneGroup.add(t3CorrectAnc);
  var t3c = addLabel("✓ If row not specified, consider BOTH possibilities", t3CorrectAnc, 0, "box-label");
  t3c.style.color = GREEN_S;
  t3c.style.display = "none";
  correctLabels.push(t3c);

  // Show two possibility spheres for Trap 3
  var t3opt1 = makeSphere(0.2, AMBER);
  t3opt1.position.set(4, trapY[2] + 0.3, 0);
  t3opt1.visible = false;
  sceneGroup.add(t3opt1);
  var t3o1a = new THREE.Object3D();
  t3o1a.position.set(5.2, trapY[2] + 0.3, 0);
  sceneGroup.add(t3o1a);
  var t3o1l = addLabel("Case 1: Row 1", t3o1a, 0, "box-label");
  t3o1l.style.display = "none";

  var t3opt2 = makeSphere(0.2, AMBER);
  t3opt2.position.set(4, trapY[2] - 0.3, 0);
  t3opt2.visible = false;
  sceneGroup.add(t3opt2);
  var t3o2a = new THREE.Object3D();
  t3o2a.position.set(5.2, trapY[2] - 0.3, 0);
  sceneGroup.add(t3o2a);
  var t3o2l = addLabel("Case 2: Row 2", t3o2a, 0, "box-label");
  t3o2l.style.display = "none";

  // Trap 4: Diagonal Confusion
  var t4WrongAnc = new THREE.Object3D();
  t4WrongAnc.position.set(0, trapY[3] + 0.5, 0);
  sceneGroup.add(t4WrongAnc);
  var t4w = addLabel("✗ 'Diagonally opposite' = facing (same position)", t4WrongAnc, 0, "trap-label");
  t4w.style.display = "none";
  wrongLabels.push(t4w);

  var t4CorrectAnc = new THREE.Object3D();
  t4CorrectAnc.position.set(0, trapY[3] - 0.5, 0);
  sceneGroup.add(t4CorrectAnc);
  var t4c = addLabel("✓ Diagonal = adjacent position in opposite row (offset by 1)", t4CorrectAnc, 0, "box-label");
  t4c.style.color = GREEN_S;
  t4c.style.display = "none";
  correctLabels.push(t4c);

  // Mini diagram for Trap 4 diagonal
  var t4d1 = makeSphere(0.18, TEAL);
  t4d1.position.set(4, trapY[3] + 0.4, 0);
  t4d1.visible = false;
  sceneGroup.add(t4d1);

  var t4d2 = makeSphere(0.18, CORAL);
  t4d2.position.set(5.2, trapY[3] - 0.4, 0);
  t4d2.visible = false;
  sceneGroup.add(t4d2);

  // Diagonal line
  var t4diagLine = makeLine(
    new THREE.Vector3(4.2, trapY[3] + 0.3, 0),
    new THREE.Vector3(5, trapY[3] - 0.3, 0),
    AMBER
  );
  t4diagLine.visible = false;
  sceneGroup.add(t4diagLine);

  var t4da = new THREE.Object3D();
  t4da.position.set(4.6, trapY[3] + 0.9, 0);
  sceneGroup.add(t4da);
  var t4dl = addLabel("Diagonal", t4da, 0, "box-label");
  t4dl.style.display = "none";

  // Floor
  var floor = makeBox(16, 0.04, 4, 0xf2f2f2);
  floor.position.set(0, -5.5, 0);
  sceneGroup.add(floor);

  animState.data = {
    trapBoxes: trapBoxes, wrongLabels: wrongLabels, correctLabels: correctLabels,
    t1ws: t1ws, t1cs: t1cs, t2ws: t2ws, t2cs: t2cs,
    t3opt1: t3opt1, t3opt2: t3opt2, t3o1l: t3o1l, t3o2l: t3o2l,
    t4d1: t4d1, t4d2: t4d2, t4diagLine: t4diagLine, t4dl: t4dl
  };

  animState.update = function(dt) {
    animState.time += dt;
    var t = animState.time, d = animState.data;

    // Trap boxes appear in sequence
    for (var i = 0; i < d.trapBoxes.length; i++) {
      var delay = i * 4;
      var elapsed = t - delay;
      if (elapsed > 0) {
        var sc = easeOut(elapsed / 0.6);
        d.trapBoxes[i].scale.set(sc, sc, sc);
      }
      // Wrong label appears 1s after box
      if (elapsed > 1) {
        d.wrongLabels[i].style.display = "";
      }
      // Correct label appears 2.5s after box
      if (elapsed > 2.5) {
        d.correctLabels[i].style.display = "";
      }
    }

    // Trap 1 indicators
    if (t > 1) d.t1ws.visible = true;
    if (t > 2.5) d.t1cs.visible = true;

    // Trap 2 indicators
    if (t > 5) d.t2ws.visible = true;
    if (t > 6.5) d.t2cs.visible = true;

    // Trap 3 possibilities
    if (t > 10.5) {
      d.t3opt1.visible = true;
      d.t3opt2.visible = true;
      d.t3o1l.style.display = "";
      d.t3o2l.style.display = "";
    }

    // Trap 4 diagonal demo
    if (t > 14.5) {
      d.t4d1.visible = true;
      d.t4d2.visible = true;
      d.t4diagLine.visible = true;
      d.t4dl.style.display = "";
    }

    // Pulse wrong indicators red
    var pulse = 0.5 + 0.5 * Math.sin(t * 4);
    if (d.t1ws.visible) d.t1ws.material.emissive.setRGB(0.3 * pulse, 0, 0);
    if (d.t2ws.visible) d.t2ws.material.emissive.setRGB(0.3 * pulse, 0, 0);

    // Pulse correct indicators green
    if (d.t1cs.visible) d.t1cs.material.emissive.setRGB(0, 0.2 * pulse, 0);
    if (d.t2cs.visible) d.t2cs.material.emissive.setRGB(0, 0.2 * pulse, 0);
  };
}

/* ===== ANIMATION LOOP ===== */
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.1);
  if (animState.update) animState.update(dt);
  controls.update();
  updateLabels();
  renderer.render(activeScene, camera);
}

/* ===== INIT ===== */
initRenderer();
loadScene(0);
animate();
</script>
